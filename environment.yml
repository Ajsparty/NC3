name: nc3

# Only conda-forge is used: mixing channels slows the solver down a lot.
channels:
  - conda-forge

dependencies:
  # Python version used and tested by the NC3 team.
  - python=3.11

  # Core data analysis and visualization packages.
  # Minimum versions only, so conda can solve quickly on any computer.
  # pandas is kept below 3.0 because pandas 3 changes default behaviour the notebooks rely on.
  - pandas>=2.0,<3
  - numpy>=1.24
  - matplotlib>=3.7
  - seaborn>=0.13
  - plotly>=5.18
  - requests>=2.31

  # Public-data formats used by the download scripts in Data_Files/.
  - lxml>=5.0
  - openpyxl>=3.1

  # Notebook environment.
  - jupyterlab>=4.0
  - notebook>=7.0
  - ipykernel>=6.25
